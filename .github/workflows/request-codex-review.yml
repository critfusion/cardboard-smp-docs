name: Request Codex Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to request a Codex review for
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-codex-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  request-codex-review:
    name: Request Codex review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    steps:
      - name: Post Codex review request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) {
              core.setFailed('A pull request number is required.');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pullRequest.draft) {
              core.info(`Skipping draft pull request #${prNumber}.`);
              return;
            }

            const headSha = pullRequest.head.sha;
            const shortSha = headSha.slice(0, 7);
            const marker = `<!-- codex-review-request:${headSha} -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`Codex review request already exists for ${headSha}.`);
              return;
            }

            const body = [
              marker,
              '@codex review',
              '',
              `Latest head: \`${shortSha}\``,
              '',
              `Latest-head-only policy: review only the latest PR head commit (${shortSha}); ignore earlier superseded commits.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
